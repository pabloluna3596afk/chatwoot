# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# executed daily at 0000 UTC
# schedules daily deferred jobs at stable times for each installation
internal_check_new_versions_job:
  cron: '0 0 * * *'
  class: 'Internal::TriggerDailyScheduledItemsJob'
  queue: scheduled_jobs

# executed daily at 0030 UTC
# safety net for closing expired usage periods (in case lazy creation misses something)
close_expired_usage_periods_job:
  cron: '30 0 * * *'
  class: 'Internal::CloseExpiredUsagePeriodsJob'
  queue: scheduled_jobs

payphone_expire_pending_payments_job:
  cron: '*/5 * * * *'
  class: 'Payphone::ExpirePendingPaymentsJob'
  queue: scheduled_jobs

payphone_billing_lifecycle_job:
  cron: '30 0 * * *'
  class: 'Payphone::BillingLifecycleJob'
  queue: scheduled_jobs
# # executed At every 5th minute..
trigger_scheduled_items_job:
  cron: '*/5 * * * *'
  class: 'TriggerScheduledItemsJob'
  queue: scheduled_jobs

# executed hourly for scheduled jobs that do not need minute-level cadence
trigger_hourly_scheduled_items_job:
  cron: '0 * * * *'
  class: 'Internal::TriggerHourlyScheduledItemsJob'
  queue: scheduled_jobs

# executed At every minute..
trigger_imap_email_inboxes_job:
  cron: '*/1 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_redis_keys_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleRedisKeysJob'
  queue: scheduled_jobs

# DISABLED: investigating if this job is the source of orphan conversations
# #executed daily at 0430 UTC
# # which will be IST 10:00 AM
# process_stale_contacts_job:
#   cron: '30 04 * * *'
#   class: 'Internal::ProcessStaleContactsJob'
#   queue: housekeeping

# executed daily at 0100 UTC
# to delete accounts marked for deletion
delete_accounts_job:
  cron: '0 1 * * *'
  class: 'Internal::DeleteAccountsJob'
  queue: scheduled_jobs

# executed every 30 minutes for assignment_v2
periodic_assignment_job:
  cron: '*/30 * * * *'
  class: 'AutoAssignment::PeriodicAssignmentJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# removes old notifications (>1 month) and trims to 300 per user
remove_old_notification_job:
  cron: '30 22 * * *'
  class: 'Notification::RemoveOldNotificationJob'
  queue: purgable

# executed every 12 hours
# to remove orphan conversations without contact
remove_orphan_conversations_job:
  cron: '0 */12 * * *'
  class: 'Internal::RemoveOrphanConversationsJob'
  queue: housekeeping

# executed daily at 0300 UTC
# hard-delete internal team chat messages older than INTERNAL_CHAT_RETENTION_DAYS
internal_chats_retention_job:
  cron: '0 3 * * *'
  class: 'InternalChats::RetentionJob'
  queue: purgable

# Linked human and Captain appointments, independent of calendar views.
reconcile_calendar_events_job:
  cron: '*/5 * * * *'
  class: 'Calendar::ReconcileEventsJob'
  queue: scheduled_jobs

# Sends Captain's due reminders every minute (a no-op in the community edition).
send_appointment_reminders_job:
  cron: '*/1 * * * *'
  class: 'Calendar::AppointmentRemindersJob'
  queue: scheduled_jobs

# executed At every minute..
# "¿Sigues ahí?" and the close for inactivity of the conversations Captain handles, and the paid re-engagement template (a no-op in the community edition)
send_captain_followup_job:
  cron: '*/1 * * * *'
  class: 'Conversations::CaptainFollowupJob'
  queue: scheduled_jobs

# executed daily at 0330 UTC
# purges the stored copies of WhatsApp template header files that no message, campaign, automation or Captain setting uses
whatsapp_header_media_cleanup_job:
  cron: '30 3 * * *'
  class: 'Whatsapp::HeaderMediaCleanupJob'
  queue: purgable

# Daily retention for automation execution history.
automation_rule_runs_retention_job:
  cron: '0 4 * * *'
  class: 'AutomationRules::PurgeRunsJob'
  queue: purgable

plan_feature_overrides_expiry_job:
  cron: '0 5 * * *'
  class: 'Plans::ExpireAccountFeatureOverridesJob'
  queue: scheduled_jobs
