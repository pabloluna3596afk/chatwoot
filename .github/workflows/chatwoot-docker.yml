name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/chatwoot

jobs:
  build-and-push:
    # Oracle Cloud Ampere aarch64 VPS; amd64-only breaks Dokploy; native arm runner avoids QEMU multi-hour builds.
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/chatwoot
          tags: |
            type=raw,value=staging
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote current develop image
        if: github.ref == 'refs/heads/develop'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/chatwoot
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          CURRENT_SHA="$(git ls-remote origin refs/heads/develop | cut -f1)"
          if [ "$CURRENT_SHA" = "$COMMIT_SHA" ]; then
            docker buildx imagetools create --tag "$IMAGE:develop" "$IMAGE@$IMAGE_DIGEST"
            echo "Promoted $COMMIT_SHA to $IMAGE:develop"
          else
            echo "Skipping develop tag: built $COMMIT_SHA, current develop is $CURRENT_SHA"
          fi

      - name: Record published image revision and digest
        if: always() && steps.image.outcome == 'success'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: echo "Built commit $COMMIT_SHA with image digest $IMAGE_DIGEST"
