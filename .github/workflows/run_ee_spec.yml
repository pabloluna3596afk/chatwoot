name: Run ChatHub EE spec
# Runs the whole backend spec/ tree with enterprise on (the CE workflow strips enterprise/ and spec/enterprise
# before running, and is disabled), plus rubocop on the changed lines and the dashboard vitest suite.
permissions:
  contents: read
on:
  push:
    branches:
      - develop
      # Feature changes run through PRs only; keep the develop push run.
  pull_request:
    branches:
      - develop
  workflow_dispatch:

# Replace superseded runs per ref, while letting develop runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  # Filter jobs rather than workflow triggers so skipped jobs still pass PR checks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ruby: ${{ steps.filter.outputs.ruby }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Preserve full test runs for develop pushes and manual dispatches.
          backend=true
          frontend=true
          ruby=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            backend=false
            frontend=false
            ruby=false
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r path; do
              # Backend paths-ignore: frontend trees, documentation trees and all Markdown.
              case "$path" in
                app/javascript/*|docs/*|docs-crm/*|*.md) ;;
                *) backend=true ;;
              esac
              # Keep dashboard tests for frontend source and package dependency changes.
              case "$path" in
                app/javascript/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|*/package.json) frontend=true ;;
              esac
              # Ruby changes alone enable the existing changed-lines Rubocop job.
              case "$path" in
                *.rb) ruby=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "ruby=$ruby"
          } >> "$GITHUB_OUTPUT"

  backend-tests:
    # Avoid provisioning backend services for frontend/documentation-only PRs.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Halve runner usage while retaining the existing round-robin split.
        ci_node_total: [8]
        ci_node_index: [0, 1, 2, 3, 4, 5, 6, 7]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm i

      - name: Create database
        run: bundle exec rake db:create

      - name: Seed database
        run: bundle exec rake db:schema:load

      - name: Run backend tests with enterprise (parallelized)
        run: |
          # The whole spec/ tree, enterprise included (the CE workflow strips enterprise/ and is disabled).
          # Round-robin split across the nodes, so slow files spread evenly.
          SPEC_FILES=($(find spec -name '*_spec.rb' | sort))
          TESTS=""

          for i in "${!SPEC_FILES[@]}"; do
            if [ $(( i % ${{ matrix.ci_node_total }} )) -eq ${{ matrix.ci_node_index }} ]; then
              TESTS="$TESTS ${SPEC_FILES[$i]}"
            fi
          done

          if [ -n "$TESTS" ]; then
            bundle exec rspec --profile=10 --format progress --format json --out tmp/rspec_results.json $TESTS
          fi
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Upload test results
        uses: actions/upload-artifact@v4
        # Store test results only when needed to investigate failures, like Rails logs.
        if: failure()
        with:
          name: ee-rspec-results-${{ matrix.ci_node_index }}
          path: tmp/rspec_results.json

      - name: Upload rails log folder
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ee-rails-log-folder-${{ matrix.ci_node_index }}
          path: log

  # Rubocop on the Ruby files the change touches (the whole-repo run belongs to the disabled CE workflow).
  rubocop-changed:
    # Skip Ruby setup when the PR changes no Ruby files.
    needs: changes
    if: needs.changes.outputs.ruby == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Rubocop on the changed lines
        run: |
          git fetch origin develop
          bundle exec ruby .github/scripts/rubocop_changed_lines.rb origin/develop

  # The dashboard (Vue) specs. Nothing else in this repo runs vitest.
  frontend-tests:
    # Skip Node setup when the PR changes no frontend source or package files.
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm i

      - name: Run vitest
        run: pnpm test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
