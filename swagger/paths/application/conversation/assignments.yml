tags:
  - Conversation Assignments
operationId: assign-a-conversation
summary: Assign Conversation
description: Assign a conversation to an agent or a team
security:
  - userApiKey: []
  - agentBotApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          assignee_id:
            type: number
            description: Id of the assignee. Null or 0 clears the assignment.
            example: 1
          assignee_type:
            type: string
            enum: ['User', 'AgentBot', 'Captain::Assistant']
            description: Assignee type. Defaults to User. Bots and assistants must be assignable to the inbox.
          team_id:
            type: number
            description: Id of the team. If the assignee_id is present, this param would be ignored
            example: 1
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/user'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: Conversation not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: Assignment was not applied. The current assignment is preserved.
    content:
      application/json:
        schema:
          type: object
          required: [error, reason]
          properties:
            error:
              type: string
              enum: [assignment_not_applied]
            reason:
              type: string
              enum: [ai_assignee_unavailable, assignee_not_found, bot_not_assignable]
